<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><title>Site sign</title>
<meta name="out" content='[{"type":"pdf","file":"07-site-and-workwear/site-sign-600x900-PRINT-half-scale.pdf"},{"type":"png","sel":".sheet","nth":0,"file":"07-site-and-workwear/previews/site-sign.png","scale":1.5}]'>
<link rel="stylesheet" href="../brand.css">
<!-- Drawn at half size (300 × 450 mm). The sign maker prints it at 200% on 600 × 900 mm corflute or ACM. -->
<style>@page{size:300mm 450mm;margin:0}.sheet{--w:300mm;--h:450mm}
.top{position:absolute;left:0;right:0;top:0;height:78mm;display:flex;align-items:center;justify-content:center}
.top img{height:46mm}
.rule{position:absolute;left:0;right:0;top:78mm;height:2.4mm}
/* Safety yellow + black is the standard warning pairing. It is the one place the suite steps outside the brand colours, on purpose. */
.warn{position:absolute;left:22mm;right:22mm;top:102mm;height:150mm;background:#FFD100;border-radius:7mm;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111}
.warn svg{width:62mm}
.warn b{font-size:54pt;font-weight:800;letter-spacing:.06em;margin-top:5mm;line-height:1}
h1{position:absolute;left:22mm;right:22mm;top:270mm;font-size:55pt;line-height:1.02;letter-spacing:-.035em}
.sub{position:absolute;left:22mm;right:22mm;top:332mm;font-size:30pt;color:var(--ink-2);font-weight:500;line-height:1.3}
.bot{position:absolute;left:0;right:0;bottom:0;height:70mm;padding:0 22mm;display:flex;align-items:center;justify-content:space-between;color:var(--band-ink)}
.bot small{display:block;font-size:17pt;color:var(--band-ink-2);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.bot b{font-size:46pt;font-weight:800;letter-spacing:-.03em;line-height:1.15}
</style></head><body>
<div class="sheet">
  <div class="top band"><img src="../../00-foundations/logos/two-points/two-points-logo-vector-white.svg"></div><div class="rule"></div>
  <div class="warn"><svg viewBox="0 0 100 90"><path d="M50 6 L95 84 H5 Z" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round"/><rect x="46" y="32" width="8" height="28" rx="4" fill="#111"/><circle cx="50" cy="70" r="5" fill="#111"/></svg><b>CAUTION</b></div>
  <h1>Rope access work overhead<span class="dot"></span></h1>
  <div class="sub">Technicians are working above this area.<br>Please keep outside the barriers.</div>
  <div class="bot band"><div><small>Site supervisor</small><b>021 0898 7180</b></div><div style="text-align:right"><small>Two Points Ltd</small><b style="font-size:30pt">twopoints.co.nz</b></div></div>
</div></body></html>
